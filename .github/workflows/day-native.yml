name: Native Day migration
on:
  push:
    branches: [day/native-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/check-day-boundary.py
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  apple-services:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile native services without legacy application views
        working-directory: native-services
        run: >-
          xcodebuild -scheme ReviewNfcGoServices -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/review-day-services CODE_SIGNING_ALLOWED=NO build
      - name: Check existing money, inventory, location and persistence rules
        run: swiftui/Tests/run.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check Day UIKit screens and MapKit renderer for the device target
        run: cargo check --locked --target aarch64-apple-ios --no-default-features --features uikit
