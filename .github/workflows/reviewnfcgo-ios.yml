name: reviewNfcGo - IPA Liquid Glass

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Rama o commit de la app nativa
        required: true
        default: ios/liquid-glass-2.9

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.REVIEWNFCGO_GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Usar la configuracion Google Places existente
        shell: bash
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            GOOGLE_PLACES_API_KEY=$(python3 -c 'import re,pathlib; text=pathlib.Path("config.js").read_text(); keys=re.findall(r"AIza[0-9A-Za-z_-]+",text); assert keys,"Falta clave Google Places"; print(keys[0])')
          fi
          echo "::add-mask::$GOOGLE_PLACES_API_KEY"
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> "$GITHUB_ENV"

      - name: Seleccionar Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tests, compilacion Release y paquete AltStore
        run: bash ios/reviewNfcGo/Scripts/build-ipa.sh "$RUNNER_TEMP/reviewNfcGo-build"

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: reviewNfcGo-2.9-LiquidGlass-AltStore
          path: ${{ runner.temp }}/reviewNfcGo-build/*.ipa
          if-no-files-found: error

      - name: Comprobacion visual en simulador iOS 26
        run: bash ios/reviewNfcGo/Scripts/verify-simulator.sh "$RUNNER_TEMP/reviewNfcGo-build"

      - name: Guardar capturas y logs de verificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewNfcGo-verificacion
          path: |
            ${{ runner.temp }}/reviewNfcGo-build/*.log
            ${{ runner.temp }}/reviewNfcGo-build/*.png
          if-no-files-found: ignore
