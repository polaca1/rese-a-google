name: reviewNfcGo - IPA Liquid Glass

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Rama o commit de la app nativa
        required: true
        default: ios/minimal-icon-4.2
      release_downloads_only:
        description: Publicar los IPA ya verificados como assets sin recompilar
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.release_downloads_only }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.REVIEWNFCGO_GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Usar la configuracion Google Places existente
        shell: bash
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            GOOGLE_PLACES_API_KEY=$(python3 -c 'import re,pathlib; text=pathlib.Path("config.js").read_text(); keys=re.findall(r"AIza[0-9A-Za-z_-]+",text); assert keys,"Falta clave Google Places"; print(keys[0])')
          fi
          echo "::add-mask::$GOOGLE_PLACES_API_KEY"
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> "$GITHUB_ENV"

      - name: Seleccionar Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tests, compilacion Release y paquete AltStore
        run: bash ios/reviewNfcGo/Scripts/build-ipa.sh "$RUNNER_TEMP/reviewNfcGo-build"

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: reviewNfcGo-IPA
          path: ${{ runner.temp }}/reviewNfcGo-build/*.ipa
          if-no-files-found: error

      - name: Comprobacion visual en simulador iOS 26
        run: bash ios/reviewNfcGo/Scripts/verify-simulator.sh "$RUNNER_TEMP/reviewNfcGo-build"

      - name: Guardar capturas y logs de verificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewNfcGo-verificacion
          path: |
            ${{ runner.temp }}/reviewNfcGo-build/*.log
            ${{ runner.temp }}/reviewNfcGo-build/*.png
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: reviewnfcgo-sidestore-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: reviewNfcGo-IPA
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: reviewNfcGo-verificacion
          path: verification
      - name: Publicar IPA verificado y actualizar fuente SideStore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          task_ipa=$(python3 -c 'import pathlib; files=list(pathlib.Path("release").glob("*.ipa")); assert len(files)==1; print(files[0])')
          task_source_commit=$(git rev-parse HEAD)
          python3 ios/reviewNfcGo/Scripts/publish-sidestore.py \
            --ipa "$task_ipa" --source-commit "$task_source_commit" \
            --notes ios/reviewNfcGo/RELEASE-NOTES.txt --previews verification

  repair-downloads:
    if: ${{ inputs.release_downloads_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: reviewnfcgo-sidestore-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Publicar descargas permanentes sin modificar los IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ios/reviewNfcGo/Scripts/publish-release-assets.py
