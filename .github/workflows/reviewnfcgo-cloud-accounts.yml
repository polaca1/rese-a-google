name: reviewNfcGo - Verificar cuentas Supabase
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Rama o commit de la conexión de cuentas
        required: true
        default: accounts/supabase-free
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - id: pin
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [mac, iphone]
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.REVIEWNFCGO_GOOGLE_PLACES_API_KEY }}
      GOOGLE_PLACES_FALLBACK_API_KEY: ${{ secrets.REVIEWNFCGO_GOOGLE_PLACES_FALLBACK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Seleccionar Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Verificar autenticación nativa y app universal de Mac
        if: matrix.platform == 'mac'
        run: bash macos/Scripts/build-mac.sh "$RUNNER_TEMP/cloud-accounts"
      - name: Tests y compilación de iPhone
        if: matrix.platform == 'iphone'
        run: bash ios/reviewNfcGo/Scripts/build-ipa.sh "$RUNNER_TEMP/cloud-accounts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewNfcGo-cuentas-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/cloud-accounts/*.log
            ${{ runner.temp }}/cloud-accounts/*.ipa
            ${{ runner.temp }}/cloud-accounts/*.dmg
            ${{ runner.temp }}/cloud-accounts/*.zip
            ${{ runner.temp }}/cloud-accounts/verification/*.json
            ${{ runner.temp }}/cloud-accounts/verification/*.png
          if-no-files-found: ignore
