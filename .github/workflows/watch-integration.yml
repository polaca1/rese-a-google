name: SideStore Watch Beta - build and verify
on:
  push:
    branches: [work/watch-automatic]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sidestore-watch-integration
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Apply pinned dependency patches
        run: python3 watch-beta/bootstrap.py
      - name: Install Rust compiler
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup component add llvm-tools-preview --toolchain 1.99.1
      - uses: actions/cache/restore@v4
        id: rustcache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/watch-ffi/source
          key: watch-beta-ffi-3e55c84-rust1991-nolto-v2
      - name: Build and verify Watch service exports
        run: python3 watch-beta/build-idevice.py > build-ffi.log 2>&1 || { tail -n 90 build-ffi.log; exit 1; }
      - uses: actions/cache/save@v4
        if: always() && steps.rustcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/watch-ffi/source
          key: watch-beta-ffi-3e55c84-rust1991-nolto-v2
      - name: Verify validation and diagnostic report
        run: |
          mkdir -p build/watch-beta
          swiftc -parse-as-library SideStore/WatchBeta/WatchBetaModels.swift watch-beta/tests/WatchBetaTests.swift -o build/watch-beta/tests
          build/watch-beta/tests | tee build/watch-beta/tests.log
      - uses: actions/cache@v4
        with:
          path: .spm
          key: watch-beta-spm-${{ hashFiles('AltStore.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build native WatchOS 10 installation probe
        run: python3 watch-beta/build-native-watch.py
      - name: Build iPhone beta
        run: |
          xcodebuild archive -project AltStore.xcodeproj -scheme 'SideStore - Release' -configuration Release -destination 'generic/platform=iOS' -archivePath build/WatchBeta -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=XYZ0123456 > build/watch-beta/build.log 2>&1 || { tail -n 100 build/watch-beta/build.log; exit 1; }
          python3 watch-beta/package.py build/WatchBeta.xcarchive/Products/Applications/SideStore.app build/watch-beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SideStore-Watch-Beta
          path: |
            build/watch-beta/*.ipa
            build/watch-beta/*.json
            build/watch-beta/SHA256SUMS
            build/watch-beta/*.log
            build-ffi.log
            build/watch-ffi/PROVENANCE.json
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=sidestore-watch-beta-0.7.1-build711
          git archive --format=zip --output=build/watch-beta/SideStore-Watch-Beta-Source.zip HEAD
          gh release create "$tag" build/watch-beta/*.ipa build/watch-beta/*.json build/watch-beta/SHA256SUMS build/watch-beta/SideStore-Watch-Beta-Source.zip --prerelease --title 'SideStore Watch Beta 0.7.1 (711) — componentes Watch automáticos' --notes-file watch-beta/RELEASE.md --target "$GITHUB_SHA"
      - name: Verify public release and publish the source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 watch-beta/publish-source.py
