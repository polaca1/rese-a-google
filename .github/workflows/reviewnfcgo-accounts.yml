name: reviewNfcGo - Servidor Windows y cuentas centrales
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit de las cuentas centrales
        required: true
        default: desktop/macos14-5.1
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verificar el servidor
        run: |
          python -m pip install -r server/requirements.txt -r server/requirements-dev.txt pyinstaller==6.16.0
          python -m pytest server/tests -q
      - name: Construir instalador sin dependencias para el propietario
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'server/windows/Configurar.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          python -m PyInstaller --noconfirm --clean --onedir --name Cuentas --paths server --collect-all argon2 --collect-all uvicorn --collect-all email_validator --distpath "$env:RUNNER_TEMP/servidor-bin" --workpath "$env:RUNNER_TEMP/servidor-build" server/windows/runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'No se ha podido compilar el servidor' }
          $package=Join-Path $env:RUNNER_TEMP 'reviewNfcGo-Servidor-Windows'
          New-Item -ItemType Directory $package -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/servidor-bin/Cuentas" "$package/runtime" -Recurse
          Copy-Item server/windows/Configurar.ps1,server/windows/Instalar.cmd,server/windows/LEEME.txt $package
          python server/windows/smoke-test.py "$package/runtime/Cuentas.exe"
          if ($LASTEXITCODE -ne 0) { throw 'El servidor de Windows no ha superado la prueba real' }
          Compress-Archive -Path "$package/*" -DestinationPath "$env:RUNNER_TEMP/reviewNfcGo-Servidor-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewNfcGo-Servidor-Windows
          path: ${{ runner.temp }}/reviewNfcGo-Servidor-Windows.zip
  native:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.REVIEWNFCGO_GOOGLE_PLACES_API_KEY }}
      GOOGLE_PLACES_FALLBACK_API_KEY: ${{ secrets.REVIEWNFCGO_GOOGLE_PLACES_FALLBACK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Verificar cuentas comunes en el Mac
        run: bash macos/Scripts/build-mac.sh "$RUNNER_TEMP/reviewNfcGo-cuentas-mac"
      - name: Comprobar compilacion de iPhone sin publicar
        run: bash ios/reviewNfcGo/Scripts/build-ipa.sh "$RUNNER_TEMP/reviewNfcGo-cuentas-ios"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewNfcGo-cuentas-verificacion
          path: |
            ${{ runner.temp }}/reviewNfcGo-cuentas-mac/*.log
            ${{ runner.temp }}/reviewNfcGo-cuentas-mac/verification/*.json
            ${{ runner.temp }}/reviewNfcGo-cuentas-ios/*.log
  publish-installer:
    needs: [windows, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: reviewNfcGo-Servidor-Windows
          path: release
      - name: Publicar configurador verificado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_tag=reviewnfcgo-server-1.0
          gh release view "$task_tag" --repo polaca1/rese-a-google >/dev/null 2>&1 || gh release create "$task_tag" --repo polaca1/rese-a-google --target "$(git rev-parse HEAD)" --title 'Servidor de cuentas de reviewNfcGo para Windows' --notes-file server/windows/LEEME.txt --latest=false
          gh release upload "$task_tag" release/*.zip server/INSTALAR-SERVIDOR.md --repo polaca1/rese-a-google --clobber
