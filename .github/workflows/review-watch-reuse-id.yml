name: Package reviewNfcGo Watch with existing App ID
on:
  push:
    branches: [work/review-watch-only-39]
    paths: [.github/workflows/review-watch-reuse-id.yml, packaging/reuse-review-id.py]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify IDs and adapt Watch metadata
        run: python3 packaging/reuse-review-id.py
      - name: Publish and verify existing-ID Watch IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload reviewnfcgo-7.3.0-build39 reuse-output/reviewNfcGo-Watch-7.3.0-build39-ReuseID.ipa reuse-output/WATCH-REUSE-ID-MANIFEST.json reuse-output/SHA256-WATCH-REUSE-ID.txt
          gh release download reviewnfcgo-7.3.0-build39 --pattern reviewNfcGo-Watch-7.3.0-build39-ReuseID.ipa --dir verified-reuse
          cd verified-reuse
          sha256sum --check ../reuse-output/SHA256-WATCH-REUSE-ID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewNfcGo-Watch-existing-ID
          path: reuse-output/*
