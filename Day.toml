# The Day project manifest: https://daybrite.dev/docs/reference/cli#the-conventional-project
# `name` and `version` come from Cargo.toml.
schema = 1
url_schemes = ["reviewnfcgo"]

[app]
id = "dev.polaca1.ReviewNfcGo"
title = "reviewNfcGo"
build = 40
targets = ["ios-uikit", "web-dom"]

# The window's size and minimum size in points, for every platform with resizable windows.
[window]
width = 960
height = 640
min_width = 320
min_height = 400

# Report which element ids the dayscripts reach: https://daybrite.dev/docs/how-to/dayscript
[dayscript.coverage]
enabled = true

[permissions]
location-when-in-use = true
notifications = true

# App extensions, each built as its own target and embedded in the app:
# https://daybrite.dev/docs/how-to/app-extensions
[[extensions]]
name = "ReviewNfcGoWidgets"
kind = "widget"
platforms = ["ios"]
deployment-target = "16.1"
live-activities = true
app-groups = ["group.org.appfair.app.ReviewNfcGo.widgets"]
build-settings = { SWIFT_ACTIVE_COMPILATION_CONDITIONS = "$(inherited) WIDGET_EXTENSION" }
