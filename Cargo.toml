[package]
name = "review-nfc-go"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Negocios, tarjetas NFC y ventas con interfaz nativa de iPhone"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# Cargo defaults to rlib; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"

[dependencies]
day = { package = "day-app", version = "0.*", features = ["model"] }
day-piece-swiftui = { version = "0.*" }

[build-dependencies]
day-build = { version = "0.*" }


[workspace]

[workspace.package]
version = "7.3.1"

[package.metadata.day.ios]
swift-packages = [{ path = "swiftui", products = ["ReviewNfcGoViews"] }]
platform = "16.1"
