name: ReviewNfcGoPreview
options:
  deploymentTarget:
    iOS: '16.1'
packages:
  ReviewNfcGoViews:
    path: ../swiftui
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '7.3.1'
    CURRENT_PROJECT_VERSION: '41'
    CODE_SIGNING_ALLOWED: 'NO'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  reviewNfcGo:
    type: application
    platform: iOS
    sources:
      - Runner
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablo.resenagoogle.20261004
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    info:
      path: Runner/Info.plist
      properties:
        CFBundleDisplayName: reviewNfcGo
        CFBundleURLTypes:
          - CFBundleURLName: com.pablo.resenagoogle.business
            CFBundleURLSchemes: [reviewnfcgo]
        NSLocationWhenInUseUsageDescription: La app necesita tu ubicación para encontrar el negocio más cercano.
        NSLocationTemporaryUsageDescriptionDictionary:
          NearbyBusiness: Usamos la ubicación precisa para distinguir los locales vecinos.
        NSSupportsLiveActivities: true
        ReviewNfcGoDistributionMode: native-swiftui-preview
        DayHostIncluded: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    entitlements:
      path: Runner/Preview.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.appfair.app.ReviewNfcGo.widgets
    dependencies:
      - package: ReviewNfcGoViews
        product: ReviewNfcGoViews
      - target: ReviewNfcGoWidgets
        embed: true
  ReviewNfcGoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../platform/ios/ReviewNfcGoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablo.resenagoogle.20261004.liveactivity
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_EXTENSION'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: reviewNfcGo
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Runner/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.appfair.app.ReviewNfcGo.widgets
schemes:
  reviewNfcGo:
    build:
      targets:
        reviewNfcGo: all
    archive:
      config: Release
