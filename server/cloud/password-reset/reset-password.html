<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://tmcccadamceaboyjwxlx.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Recuperar contraseña · reviewNfcGo</title>
  <link rel="stylesheet" href="reset-password.css">
  <script src="reset-password.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">reviewNfcGo</p>
    <h1 id="title">¿Olvidaste tu contraseña?</h1>
    <p id="description">Introduce el correo de tu cuenta. Te enviaremos un enlace para elegir una contraseña nueva.</p>
    <form id="request-form">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" required maxlength="254">
      <button type="submit">Enviar enlace</button>
    </form>
    <form id="password-form" hidden>
      <label for="password">Nueva contraseña</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <p class="hint">Entre 8 y 128 caracteres.</p>
      <label for="confirmation">Repite la contraseña</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <button type="submit">Guardar contraseña</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="restart" type="button" hidden>Pedir otro enlace</button>
    <p id="google-help" class="hint">Si entras con Google, también puedes seguir usando «Continuar con Google» en la app.</p>
  </main>
</body>
</html>
