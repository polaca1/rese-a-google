<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>reviewNfcGo</title><style>body{font-family:system-ui;margin:0;background:#f5f5f7;color:#1d1d1f;display:grid;place-items:center;min-height:100dvh}main{padding:32px;max-width:440px;text-align:center}a{display:inline-block;background:#007aff;color:white;padding:14px 24px;border-radius:16px;text-decoration:none}</style><main><h1>reviewNfcGo</h1><p id="message">Abriendo enlace…</p><a id="destination" hidden rel="noreferrer">Continuar</a></main><script>
